<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facts and Formulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: figure on the left, numbered steps on the right; one proof on screen at a time.
     Colour code used in every proof: amber = a, teal = b, violet = c. */
  --paper:#eef1f5; --card:#ffffff; --ink:#16202b; --muted:#566370; --line:#cdd5de;
  --tri:#c5d0dd; --sq:#e9e2c8;
  --a:#e58a22; --b:#18a08f; --c:#6157e0;
  --a-soft:#fbe0c2; --b-soft:#c4ebe5; --c-soft:#dcd9fa;
  --accent:#1c4f8f; --on-accent:#ffffff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10151b; --card:#19212b; --ink:#e9eef3; --muted:#9ba8b5; --line:#34414f;
    --tri:#3d4d60; --sq:#5a5335;
    --a:#f0a14c; --b:#3fc6b6; --c:#948dff;
    --a-soft:#573a19; --b-soft:#1b4a44; --c-soft:#322f60;
    --accent:#86b6f0; --on-accent:#0d1620;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10151b; --card:#19212b; --ink:#e9eef3; --muted:#9ba8b5; --line:#34414f;
  --tri:#3d4d60; --sq:#5a5335;
  --a:#f0a14c; --b:#3fc6b6; --c:#948dff;
  --a-soft:#573a19; --b-soft:#1b4a44; --c-soft:#322f60;
  --accent:#86b6f0; --on-accent:#0d1620;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.05;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:62ch}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button .n{font-family:var(--display);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .n{color:inherit}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.figure,.notes{background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.figure{padding:14px;display:flex;flex-direction:column;gap:12px}
#fig{display:block;width:100%;max-height:min(62vh,600px);touch-action:pan-y}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent);height:28px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
ol.steps li{cursor:pointer}
ol.steps li:hover{border-color:var(--line)}
ol.steps li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-width:88px}
button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.shape{border-top:1.5px solid var(--line);padding-top:12px}
.shape label{font-weight:700}
.nums{font-variant-numeric:tabular-nums;color:var(--muted);flex:1 1 100%}
.nums b{color:var(--ink)}
.ka{color:var(--a)} .kb{color:var(--b)} .kc{color:var(--c)}
.notes{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.credit{margin:0;color:var(--muted);font-size:.92rem}
h2{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;margin:0;text-wrap:balance}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid transparent;color:var(--muted)}
ol.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
ol.steps li.on{color:var(--ink);border-color:var(--accent);background:var(--paper)}
ol.steps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.algebra{margin:0;padding:12px 14px;border-radius:10px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums;overflow-x:auto}
.algebra span{display:block;white-space:nowrap}
.hint{margin:0;color:var(--muted);font-size:.9rem}
h2.sec{font-family:var(--display);font-size:1.3rem;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.fc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fc h3{margin:0;font-family:var(--display);font-size:1.15rem}
.fc svg{display:block;width:100%;height:auto}
.fc svg text{font-family:var(--body);fill:var(--ink)}
.fl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:1.05rem}
.fl li{display:flex;align-items:center;gap:.45em;flex-wrap:wrap}
.fl .n{font:inherit;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:center;padding:2px 9px;border-radius:8px;border:1.5px solid transparent;background:var(--a-soft);color:var(--ink)}
.test .fl .n{cursor:pointer;background:var(--paper);border:1.5px dashed var(--muted);color:var(--muted)}
.test .fl .n.open{background:var(--b-soft);border:1.5px solid transparent;color:var(--ink)}
.test .fc svg{display:none}
.fc .also{margin:0;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.chips button{font:inherit;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <a class="back" href="index.html">&larr; All activities</a>
    <h1>Facts and formulas</h1>
    <p class="lede">Know these by heart.</p>
  </header>
  <div class="chips" id="mode"><button type="button" class="on">Learn</button><button type="button">Test me</button></div>
  <h2 class="sec">Units</h2>
  <div class="grid" id="units"></div>
</div>
<script>
// To add a fact: add one line ['1 big thing','how many','small things'] to the right group.
const UNITS=[
 {t:'Length',pic:'length',f:[['1 foot','12','inches'],['1 yard','3','feet'],['1 mile','5,280','feet']]},
 {t:'Volume',pic:'volume',f:[['1 gallon','4','quarts'],['1 quart','2','pints'],['1 pint','2','cups'],['1 cup','8','fluid ounces']]},
 {t:'Weight',pic:'weight',f:[['1 pound','16','ounces'],['1 ton','2,000','pounds']]},
 {t:'Time',pic:'time',f:[['1 minute','60','seconds'],['1 hour','60','minutes'],['1 day','24','hours'],['1 week','7','days'],['1 year','365','days']]},
 {t:'Metric',pic:'metric',f:[['1 kilometer','1,000','meters'],['1 meter','100','centimeters'],['1 meter','1,000','millimeters']],also:'Kilo, centi and milli mean the same for grams and liters.'},
 {t:'Counting',pic:'dozen',f:[['1 dozen','12','']]}
];
const S='stroke="var(--ink)" stroke-width="1.5"';
const PIC={
 length(){let o='';
  for(let i=0;i<12;i++)o+=`<rect x="${10+i*20}" y="12" width="20" height="26" fill="var(--a-soft)" ${S}/>`;
  for(let i=0;i<3;i++)o+=`<rect x="${10+i*80}" y="68" width="80" height="26" fill="var(--b-soft)" ${S}/>`;
  o+=`<rect x="10" y="124" width="240" height="26" rx="4" fill="var(--c-soft)" ${S}/><line x1="18" y1="137" x2="242" y2="137" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="9 7"/>`;
  [['1 ft','12 inches',12],['1 yd','3 feet',68],['1 mi','5,280 feet',124]].forEach(r=>o+=`<text x="260" y="${r[2]+19}" font-size="15" font-weight="800">${r[0]}</text><text x="10" y="${r[2]+42}" font-size="12.5" style="fill:var(--muted)">${r[1]}</text>`);
  return `<svg viewBox="0 0 320 172" role="img" aria-label="A foot is 12 inches, a yard is 3 feet, a mile is 5,280 feet">${o}</svg>`},
 volume(){let o=`<rect x="8" y="8" width="172" height="172" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2.2"/>`;
  for(let q=0;q<4;q++){const qx=14+(q%2)*83,qy=14+Math.floor(q/2)*83;o+=`<rect x="${qx}" y="${qy}" width="77" height="77" rx="7" fill="var(--a-soft)" ${S}/>`;
    for(let p=0;p<2;p++){const px=qx+5+p*36,py=qy+5;o+=`<rect x="${px}" y="${py}" width="31" height="67" rx="5" fill="var(--b-soft)" ${S}/>`;
      for(let c=0;c<2;c++)o+=`<rect class="cup" x="${px+4}" y="${py+4+c*31}" width="23" height="28" rx="4" fill="var(--c-soft)" stroke="var(--ink)" stroke-width="1.2"/>`}}
  [['var(--card)','1 gallon'],['var(--a-soft)','4 quarts'],['var(--b-soft)','8 pints'],['var(--c-soft)','16 cups']].forEach((r,i)=>o+=`<rect x="196" y="${14+i*31}" width="20" height="20" rx="4" fill="${r[0]}" ${S}/><text x="226" y="${29+i*31}" font-size="14" font-weight="700">${r[1]}</text>`);
  o+=`<rect x="196" y="140" width="22" height="40" rx="3" fill="var(--c-soft)" ${S}/>`;for(let i=1;i<8;i++)o+=`<line x1="196" y1="${140+i*5}" x2="${i%2?207:218}" y2="${140+i*5}" stroke="var(--ink)" stroke-width="1"/>`;
  o+=`<text x="226" y="158" font-size="13" font-weight="700">1 cup</text><text x="226" y="175" font-size="13" font-weight="700">8 fl oz</text>`;
  return `<svg viewBox="0 0 320 188" role="img" aria-label="A gallon holds 4 quarts, 8 pints, 16 cups. A cup is 8 fluid ounces">${o}</svg>`},
 weight(){let o='';for(let i=0;i<16;i++)o+=`<rect class="oz" x="${22+(i%4)*19}" y="${12+Math.floor(i/4)*19}" width="19" height="19" fill="var(--a-soft)" ${S}/>`;
  o+=`<text x="60" y="108" text-anchor="middle" font-size="13.5" font-weight="700">1 lb = 16 oz</text>`;
  o+=`<circle cx="218" cy="22" r="9" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M160 88 L176 30 H260 L276 88 Z" fill="var(--b-soft)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/><text x="218" y="68" text-anchor="middle" font-size="17" font-weight="800">2,000 lb</text><text x="218" y="108" text-anchor="middle" font-size="13.5" font-weight="700">1 ton</text>`;
  return `<svg viewBox="0 0 320 118" role="img" aria-label="A pound is 16 ounces, a ton is 2,000 pounds">${o}</svg>`},
 time(){let o='';const xs=[34,97,160,223,286],nm=['second','minute','hour','day','week'],k=['60','60','24','7'];
  const box=(x,y,t)=>`<rect x="${x-26}" y="${y}" width="52" height="28" rx="8" fill="var(--c-soft)" ${S}/><text x="${x}" y="${y+18.5}" text-anchor="middle" font-size="12" font-weight="700">${t}</text>`;
  xs.forEach((x,i)=>{o+=box(x,34,nm[i]);if(i<4){const m=(x+xs[i+1])/2;o+=`<text x="${m}" y="24" text-anchor="middle" font-size="15" font-weight="800">${k[i]}</text><path d="M${m-3} 43 l5 5 l-5 5" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`}});
  o+=`<line x1="223" y1="62" x2="223" y2="92" stroke="var(--ink)" stroke-width="1.5"/><path d="M218 84 l5 6 l5 -6" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="232" y="82" font-size="15" font-weight="800">365</text>`+box(223,94,'year');
  return `<svg viewBox="0 0 320 130" role="img" aria-label="60 seconds in a minute, 60 minutes in an hour, 24 hours in a day, 7 days in a week, 365 days in a year">${o}</svg>`},
 metric(){let o=`<rect x="10" y="12" width="300" height="26" fill="var(--a-soft)" ${S}/>`;
  for(let i=1;i<100;i++)o+=`<line class="cm" x1="${10+i*3}" y1="12" x2="${10+i*3}" y2="${i%10?19:26}" stroke="var(--ink)" stroke-width="${i%10?.7:1.4}"/>`;
  o+=`<text x="310" y="57" text-anchor="end" font-size="13" font-weight="700">1 m = 100 cm</text><path d="M10 38 L10 78 M13 38 L160 78" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>`;
  for(let i=0;i<10;i++)o+=`<rect class="mm" x="${10+i*15}" y="78" width="15" height="22" fill="var(--b-soft)" ${S}/>`;
  o+=`<text x="170" y="94" font-size="13" font-weight="700">1 cm = 10 mm</text>`;
  return `<svg viewBox="0 0 320 108" role="img" aria-label="A meter stick with 100 centimeters, and one centimeter split into 10 millimeters">${o}</svg>`},
 dozen(){let o=`<rect x="40" y="8" width="240" height="70" rx="14" fill="var(--paper)" ${S}/>`;
  for(let i=0;i<12;i++)o+=`<ellipse class="egg" cx="${60+(i%6)*40}" cy="${28+Math.floor(i/6)*30}" rx="11" ry="12.5" fill="var(--a-soft)" ${S}/>`;
  return `<svg viewBox="0 0 320 86" role="img" aria-label="Twelve eggs in a tray">${o}</svg>`}
};
const $=id=>document.getElementById(id);
let test=false;const open=new Set();
function render(){
  $('wrap').classList.toggle('test',test);
  $('units').innerHTML=UNITS.map((g,gi)=>`<section class="fc"><h3>${g.t}</h3>${PIC[g.pic]()}<ul class="fl">${g.f.map((x,i)=>{const id=gi+'-'+i,show=!test||open.has(id);
    return `<li><span>${x[0]} =</span><button type="button" class="n${test&&show?' open':''}" data-id="${id}"${test?` aria-label="${show?x[1]:'Show the answer'}"`:' tabindex="-1"'}>${show?x[1]:'?'}</button><span>${x[2]}</span></li>`}).join('')}</ul>${g.also?`<p class="also">${g.also}</p>`:''}</section>`).join('');
  [...$('mode').children].forEach((b,i)=>b.classList.toggle('on',(i===1)===test));
}
$('mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;test=b===$('mode').children[1];open.clear();render()});
$('units').addEventListener('click',e=>{const b=e.target.closest('.n');if(!b||!test)return;const id=b.dataset.id;if(open.has(id))open.delete(id);else open.add(id);render()});
render();
</script>
</body>
</html>
