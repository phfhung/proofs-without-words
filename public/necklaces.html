<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermat's Necklaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: figure on the left, numbered steps on the right; one proof on screen at a time.
     Colour code used in every proof: amber = a, teal = b, violet = c. */
  --paper:#eef1f5; --card:#ffffff; --ink:#16202b; --muted:#566370; --line:#cdd5de;
  --tri:#c5d0dd; --sq:#e9e2c8;
  --a:#e58a22; --b:#18a08f; --c:#6157e0;
  --a-soft:#fbe0c2; --b-soft:#c4ebe5; --c-soft:#dcd9fa;
  --accent:#1c4f8f; --on-accent:#ffffff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10151b; --card:#19212b; --ink:#e9eef3; --muted:#9ba8b5; --line:#34414f;
    --tri:#3d4d60; --sq:#5a5335;
    --a:#f0a14c; --b:#3fc6b6; --c:#948dff;
    --a-soft:#573a19; --b-soft:#1b4a44; --c-soft:#322f60;
    --accent:#86b6f0; --on-accent:#0d1620;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10151b; --card:#19212b; --ink:#e9eef3; --muted:#9ba8b5; --line:#34414f;
  --tri:#3d4d60; --sq:#5a5335;
  --a:#f0a14c; --b:#3fc6b6; --c:#948dff;
  --a-soft:#573a19; --b-soft:#1b4a44; --c-soft:#322f60;
  --accent:#86b6f0; --on-accent:#0d1620;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.05;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:62ch}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button .n{font-family:var(--display);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .n{color:inherit}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.figure,.notes{background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.figure{padding:14px;display:flex;flex-direction:column;gap:12px}
#fig{display:block;width:100%;max-height:min(62vh,600px);touch-action:pan-y}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent);height:28px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
ol.steps li{cursor:pointer}
ol.steps li:hover{border-color:var(--line)}
ol.steps li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-width:88px}
button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.shape{border-top:1.5px solid var(--line);padding-top:12px}
.shape label{font-weight:700}
.nums{font-variant-numeric:tabular-nums;color:var(--muted);flex:1 1 100%}
.nums b{color:var(--ink)}
.ka{color:var(--a)} .kb{color:var(--b)} .kc{color:var(--c)}
.notes{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.credit{margin:0;color:var(--muted);font-size:.92rem}
h2{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;margin:0;text-wrap:balance}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid transparent;color:var(--muted)}
ol.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
ol.steps li.on{color:var(--ink);border-color:var(--accent);background:var(--paper)}
ol.steps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.algebra{margin:0;padding:12px 14px;border-radius:10px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums;overflow-x:auto}
.algebra span{display:block;white-space:nowrap}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.nk svg{display:block;width:100%;height:auto}
.nk text{font-family:var(--body);fill:var(--ink)}
.nk [data-i],.nk [data-q]{cursor:pointer}
.rule{margin:0;padding:10px 14px;border-radius:10px;background:var(--paper);font-weight:700;text-align:center;min-height:4.6em;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rule .big{font-family:var(--display);font-size:1.3rem}
.rule .sm{color:var(--muted);font-size:.9rem;font-weight:400}
.picks{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.picks label{font-weight:700;display:flex;gap:8px;align-items:center}
.picks select,.picks input[type=text]{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.picks input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button.on{box-shadow:inset 0 0 0 1.5px var(--accent);border-color:var(--accent)}
.chips.seq button{border-color:var(--line)}
.chips button{font:inherit;font-size:.9rem;font-weight:700;padding:4px 9px;border-radius:8px;border:1.5px solid #d6457a;background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.how{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.fm{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.2em .45em;margin:0;padding:12px 14px;border-radius:10px;background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.fm.sm{font-size:1.05rem}
.fm .op{font-weight:400}
.out{margin:0;padding:10px 14px;border-radius:10px;background:var(--paper);font-weight:700;overflow-wrap:anywhere}
.out .ok{color:var(--b)}.out .no{color:#d6457a}
.steps li b{color:var(--ink)}
[hidden]{display:none!important}
h3{font-family:var(--display);font-weight:800;font-size:1.1rem;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">&larr; All activities</a>
    <h1>Fermat&rsquo;s necklaces</h1>
    <p class="lede">Make every possible string of beads, then sort the strings into necklaces. When the number of beads is prime, the piles all come out the same size. Drawn on a clock, the same fact becomes a test for primes.</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Choose an activity"></nav>

  <main class="stage">
    <section class="figure nk" aria-label="Picture">
      <div class="picks" id="c-test" hidden>
        <label>Colours <select id="base"><option>2</option><option>3</option><option>5</option><option>7</option></select></label>
        <label><input id="strong" type="checkbox"> Add the extra check</label>
      </div>
      <div class="picks" id="c-clock" hidden>
        <label>Clock size <select id="cn"></select></label>
        <label>Start from <select id="cb"><option>2</option><option>3</option><option>5</option><option>7</option></select></label>
      </div>
      <svg id="fig" viewBox="0 0 440 340" role="img" aria-label="Picture"></svg>
      <div class="row" id="c-step">
        <button class="btn" id="prev" type="button" aria-label="Back">&larr; Back</button>
        <button class="btn primary" id="next" type="button" aria-label="Next">Next &rarr;</button>
      </div>
      <div class="rule" id="rule" aria-live="polite"></div>
      <div class="picks shape" id="c-size">
        <label>Colours <select id="col"><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
        <label>Beads <select id="len"></select></label>
      </div>
    </section>

    <section class="notes" id="notes"></section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
const TABS=['Sort the necklaces','Who passes?','Round the clock'];
const PC=['var(--a)','var(--b)','var(--c)','#d6457a','#2f80d0'],PINK='#d6457a',MAXN={2:7,3:4,4:3,5:3},LIM=600;
let tab=0,a=2,n=5,st=0,gl=0,sel=1,anim=0,S=null,base=2,strong=false,q=341,cn=561,cb=2,hop=0,hp=0;
const CLOCKS=[13,15,17,25,41,91,97,341,561];
const isPrime=x=>{if(x<2)return false;for(let d=2;d*d<=x;d++)if(x%d===0)return false;return true};
const factor=x=>{const f=[];for(let d=2;d*d<=x;d++)while(x%d===0){f.push(d);x/=d}if(x>1)f.push(x);return f};
const sup=x=>(''+x).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('');

// ---------- tab 1: every string of n beads in a colours, sorted by necklace ----------
function build(){
  const tot=Math.pow(a,n),hi=Math.pow(a,n-1),str=[],seen=new Set(),piles=[];
  for(let i=0;i<tot;i++){const d=[];let x=i;for(let k=0;k<n;k++){d.unshift(x%a);x=Math.floor(x/a)}str.push(d)}
  for(let i=0;i<tot;i++){if(seen.has(i))continue;const p=[];let v=i;do{p.push(v);seen.add(v);v=(v*a)%tot+Math.floor(v/hi)}while(v!==i);piles.push(p)}
  piles.sort((x,y)=>(y.length-x.length)||(x[0]-y[0]));
  const where=[];piles.forEach((p,j)=>p.forEach((v,k)=>where[v]=[j,k]));
  const bs=tot>64?8:tot>32?9:11,sw=n*bs,cw=sw+12,ch=bs+6,cols=Math.floor(424/cw),gx=(440-cols*cw)/2+6;
  const pw=sw+14,per=Math.floor(424/pw),px=(440-per*pw)/2+7,prh=n*(bs+2)+30,Y0=150;
  const gridH=Math.ceil(tot/cols)*ch,pileH=Math.ceil(piles.length/per)*prh;
  S={tot,str,piles,where,bs,sw,Y0,H:Y0+Math.max(gridH,pileH)+10,
    grid:i=>[gx+(i%cols)*cw,Y0+Math.floor(i/cols)*ch+bs/2],
    pile:i=>{const[j,k]=where[i];return[px+(j%per)*pw,Y0+Math.floor(j/per)*prh+k*(bs+2)+bs/2]},
    foot:j=>[px+(j%per)*pw+sw/2,Y0+Math.floor(j/per)*prh+piles[j].length*(bs+2)+13]};
  if(sel>=tot)sel=1;
}
function draw0(){
  const{tot,str,piles,where,bs,sw,H}=S,e=gl<.5?2*gl*gl:1-2*(1-gl)*(1-gl),r=bs/2-.8,my=piles[where[sel][0]];let o='';
  $('fig').setAttribute('viewBox',`0 0 440 ${H}`);
  if(st===0)o+=`<text x="220" y="70" text-anchor="middle" font-size="30" font-weight="800" style="font-family:var(--display)">${tot} strings</text><text x="220" y="98" text-anchor="middle" font-size="14" style="fill:var(--muted)">${n} beads, ${a} colours for each: ${Array(n).fill(a).join(' × ')}</text>`;
  else{
    // the chosen necklace, and the strings you get by cutting it at each gap
    const cx=66,cy=74,R=42,br=Math.min(11,Math.PI*R/n-2.5),d=str[sel];
    o+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    for(let k=0;k<n;k++){const t=k/n*2*Math.PI;o+=`<line x1="${cx+(R-7)*Math.sin(t)}" y1="${cy-(R-7)*Math.cos(t)}" x2="${cx+(R+7)*Math.sin(t)}" y2="${cy-(R+7)*Math.cos(t)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 2"/>`}
    for(let k=0;k<n;k++){const t=(k+.5)/n*2*Math.PI;o+=`<circle cx="${cx+R*Math.sin(t)}" cy="${cy-R*Math.cos(t)}" r="${br}" fill="${PC[d[k]]}" stroke="var(--ink)" stroke-width="1.2"/>`}
    const rs=13,y0=74-my.length*rs/2+rs/2,x0=146;
    my.forEach((v,k)=>{for(let b=0;b<n;b++)o+=`<circle cx="${x0+b*12+6}" cy="${y0+k*rs}" r="5" fill="${PC[str[v][b]]}"/>`});
    o+=`<path d="M${x0+n*12+8} ${y0-6} h6 V${y0+(my.length-1)*rs+6} h-6" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    o+=`<text x="${x0+n*12+24}" y="72" font-size="16" font-weight="700"${my.length<n&&my.length>1?` style="fill:${PINK}"`:''}>${my.length===n?'':'only '}${my.length} ${my.length===1?'string':'strings'}</text><text x="${x0+n*12+24}" y="90" font-size="12" style="fill:var(--muted)">from this necklace</text>`;
    o+=`<text x="66" y="140" text-anchor="middle" font-size="11" style="fill:var(--muted)">cut at any gap</text>`}
  // all the strings: in counting order at first, then gliding into piles
  for(let i=0;i<tot;i++){const g=S.grid(i),p=S.pile(i),x=g[0]+(p[0]-g[0])*e,y=g[1]+(p[1]-g[1])*e,on=st>0&&where[i][0]===where[sel][0];
    o+=`<g data-i="${i}">${on?`<rect x="${x-3}" y="${y-bs/2}" width="${sw+5}" height="${bs+1}" rx="${bs/2}" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>`:`<rect x="${x-3}" y="${y-bs/2}" width="${sw+5}" height="${bs+1}" fill="transparent"/>`}`;
    for(let b=0;b<n;b++)o+=`<circle cx="${x+b*bs+bs/2-.5}" cy="${y+.5}" r="${r}" fill="${PC[str[i][b]]}"/>`;
    o+='</g>'}
  if(st>=2&&gl>.98)piles.forEach((p,j)=>{const f=S.foot(j),odd=p.length>1&&p.length<n;o+=`<text x="${f[0]}" y="${f[1]}" text-anchor="middle" font-size="13" font-weight="700" style="fill:${odd?PINK:p.length===1?'var(--muted)':'var(--ink)'}">${p.length}</text>`});
  $('fig').innerHTML=o;
  // the sentence underneath
  const cnt={};piles.forEach(p=>cnt[p.length]=(cnt[p.length]||0)+1);const full=cnt[n]||0,pr=isPrime(n),div=(tot-a)%n===0;
  const sum=Object.keys(cnt).map(Number).sort((x,y)=>x-y).map(s=>s===1?''+cnt[1]:`${cnt[s]} × ${s}`).join(' + ');
  $('rule').innerHTML=[
    `<span>Every string of ${n} beads, with ${a} colours to choose from for each bead.</span><span class="big">${a}${sup(n)} = ${tot}</span>`,
    `<span>Join the ends of a string to make a necklace. Cut it at a different gap and you get a different string.</span><span class="sm">Tap any string to see its necklace.</span>`,
    `<span>Sort the strings by necklace. ${pr?`Every pile has ${n} strings, except the ${a} one-colour strings.`:`Most piles have ${n} strings, but some are smaller.`}</span><span class="big">${tot} = ${sum}</span>`,
    pr?`<span>Take away the ${a} one-colour strings. What is left is ${full} full ${full===1?'pile':'piles'} of ${n}.</span><span class="big">${a}${sup(n)} − ${a} = ${tot-a} = ${full} × ${n}</span>`
     :`<span>${div?`This time ${tot-a} happens to be a multiple of ${n} anyway, even though the piles are uneven.`:`${tot-a} is not a multiple of ${n}. Uneven piles give ${n} away: it is not prime.`}</span><span class="big">${a}${sup(n)} − ${a} = ${tot-a}${div?` = ${(tot-a)/n} × ${n}`:''}</span>`][st];
}

// ---------- tab 2: use it as a test ----------
const mulmod=(x,y,m)=>Number(BigInt(x)*BigInt(y)%BigInt(m));
function powmod(b,e,m){let r=1%m;b%=m;while(e>0){if(e&1)r=mulmod(r,b,m);b=mulmod(b,b,m);e=Math.floor(e/2)}return r}
// plain test: is b^m - b a multiple of m?  strong test: Miller-Rabin's extra look at square roots of 1
function passes(m,b,hard){
  if(m<2)return false;if(!hard)return powmod(b,m,m)===b%m;
  if(m===2)return true;if(m%2===0)return false;if(b%m===0)return isPrime(m);
  let d=m-1,s=0;while(d%2===0){d/=2;s++}let x=powmod(b,d,m);if(x===1||x===m-1)return true;
  for(let i=1;i<s;i++){x=mulmod(x,x,m);if(x===m-1)return true}return false}
const liars=()=>{const o=[];for(let m=2;m<=LIM;m++)if(passes(m,base,strong)&&!isPrime(m))o.push(m);return o};
function draw1(){
  const C=25,c=16.8,x0=10,y0=6;let o='';$('fig').setAttribute('viewBox',`0 0 440 ${y0+LIM/C*c+8}`);
  for(let m=1;m<=LIM;m++){const x=x0+((m-1)%C)*c,y=y0+Math.floor((m-1)/C)*c,ok=passes(m,base,strong),p=isPrime(m);
    o+=`<rect data-q="${m}" x="${x+.8}" y="${y+.8}" width="${c-1.6}" height="${c-1.6}" rx="2.5" fill="${ok?(p?'var(--b)':PINK):'var(--paper)'}"${m===q?' stroke="var(--ink)" stroke-width="2.5"':''}/>`}
  $('fig').innerHTML=o;
  const L=liars(),p=isPrime(q),ok=passes(q,base,strong),f=factor(q).join(' × ');
  const what=strong?`passes the extra check`:`${base}${sup(q)} − ${base} is a multiple of ${q}`;
  $('rule').innerHTML=`<span><b style="color:var(--b)">Green</b> passes and is prime. <b style="color:${PINK}">Pink</b> passes but is not prime: a liar.</span>`+
    (L.length?`<div class="chips" aria-label="Liars up to ${LIM}">${L.map(m=>`<button type="button" data-q="${m}">${m}</button>`).join('')}</div>`:`<span class="sm">No liars at all up to ${LIM}.</span>`)+
    (q>=5&&q%2===1?`<div class="chips"><button type="button" data-clock="${q}" style="border-color:var(--line)">See ${q} on the clock</button></div>`:'')+`<span class="sm">${q===1?'1 is not counted as prime.':p?`${q} is prime, and ${what}.`:ok?`${q} = ${f} is not prime, yet ${what}.`:`${q} = ${f} fails the test, so it is caught.`}</span>`;
}
// ---------- tab 3: the test as hops round a clock ----------
// n - 1 = d x 2 x 2 x ... x 2. Start at b^d, then square. A prime clock lets you reach 1 only from n - 1.
function route(){let d=cn-1,k=0;while(d%2===0){d/=2;k++}const r=[powmod(cb,d,cn)];for(let i=0;i<k&&r[r.length-1]!==1;i++)r.push(mulmod(r[r.length-1],r[r.length-1],cn));
  const end=r[r.length-1],v=end!==1?'never':r.length===1||r[r.length-2]===cn-1?'pass':'wrong';return{d,k,r,v}}
function draw2(){
  const m=cn,{d,k,r,v}=route(),cx=220,cy=236,R=140,PT=(x,rad)=>{const t=x/m*2*Math.PI;return[cx+(rad||R)*Math.sin(t),cy-(rad||R)*Math.cos(t)]};let o='';
  $('fig').setAttribute('viewBox','0 0 440 436');
  const roots=[];for(let x=2;x<m-1;x++)if(x*x%m===1)roots.push(x);
  const lab=(x,t,col,w)=>{const q=PT(x,R+17),side=q[0]>cx+12?'start':q[0]<cx-12?'end':'middle';return `<text x="${q[0]}" y="${q[1]+4}" text-anchor="${side}" font-size="12" font-weight="${w||700}" style="fill:${col}">${t}</text>`};
  o+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--paper)" stroke="var(--line)" stroke-width="2"/>`;
  if(m<=41)for(let x=0;x<m;x++){const q=PT(x);o+=`<circle cx="${q[0]}" cy="${q[1]}" r="2.4" fill="var(--muted)"/>`}
  // the top of the clock, close up: on a big clock n-1, 0 and 1 are too close together to tell apart
  const bw=46,bx=cx-2.5*bw,by=24,cells=[m-2,m-1,0,1,2],at=hp>0?-1:r[hop];
  o+=`<text x="${bx-8}" y="${by+20}" text-anchor="end" font-size="11" style="fill:var(--muted)">top, close up</text>`;
  o+=`<path d="M${bx} ${by+30} L${cx-10} ${cy-R} M${bx+5*bw} ${by+30} L${cx+10} ${cy-R}" stroke="var(--muted)" stroke-dasharray="3 4" fill="none"/>`;
  cells.forEach((x,i)=>{const door=i===1||i===3;o+=`<rect x="${bx+i*bw+2}" y="${by}" width="${bw-4}" height="30" rx="6" fill="${door?'var(--b-soft)':'var(--card)'}" stroke="${x===at?'var(--a)':door?'var(--b)':'var(--line)'}" stroke-width="${x===at?3.5:1.5}"/><text x="${bx+(i+.5)*bw}" y="${by+20}" text-anchor="middle" font-size="13" font-weight="700"${i===2?' style="fill:var(--muted)"':''}>${x}</text>`});
  const used=r.slice(0,hop+1),viaDoor=used.some((x,i)=>i>0&&x===1&&used[i-1]===m-1);
  if(viaDoor)o+=`<path d="M${bx+1.5*bw} ${by-3} C${bx+1.8*bw} ${by-20} ${bx+3.2*bw} ${by-20} ${bx+3.5*bw} ${by-5}" fill="none" stroke="var(--b)" stroke-width="2.5"/><path d="M${bx+3.5*bw} ${by-3} l-9 -3 l5 -7 z" fill="var(--b)"/>`;
  // points whose square is 1: the two beside the top on any clock, and extra ones (pink) only when n is not prime
  roots.forEach(x=>{const q=PT(x);o+=`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="var(--card)" stroke="${PINK}" stroke-width="3"/>`+lab(x,x,PINK)});
  [1,m-1].forEach(x=>{const q=PT(x);o+=`<circle cx="${q[0]}" cy="${q[1]}" r="6" fill="var(--b)" stroke="var(--ink)" stroke-width="1.2"/>`+(m<=41?lab(x,x,'var(--b)'):'')});
  // the hops
  const seg=(x,y,f)=>{const A=PT(x),B=PT(y),E=[A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f],bad=y===1&&x!==m-1,L=Math.hypot(B[0]-A[0],B[1]-A[1])||1,ux=(B[0]-A[0])/L,uy=(B[1]-A[1])/L;
    return `<line x1="${A[0]}" y1="${A[1]}" x2="${E[0]}" y2="${E[1]}" stroke="${bad?PINK:'var(--a)'}" stroke-width="3" stroke-linecap="round"/>`+(f>=1&&L>14?`<path d="M${B[0]-ux*7} ${B[1]-uy*7} l${-ux*10-uy*5} ${-uy*10+ux*5} l${uy*10} ${-ux*10} z" fill="${bad?PINK:'var(--a)'}"/>`:'')};
  for(let i=0;i<hop;i++)o+=seg(r[i],r[i+1],1);
  if(hp>0&&hop<r.length-1)o+=seg(r[hop],r[hop+1],hp<.5?2*hp*hp:1-2*(1-hp)*(1-hp));
  used.forEach((x,i)=>{const q=PT(x);if(!roots.includes(x)&&x!==1&&x!==m-1)o+=`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="var(--a)" stroke="var(--ink)" stroke-width="1.2"/>`+lab(x,x,'var(--ink)');
    else if(roots.includes(x))o+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${PINK}"/>`});
  {const A=PT(r[hop]),B=hop<r.length-1?PT(r[hop+1]):A,e=hp<.5?2*hp*hp:1-2*(1-hp)*(1-hp);o+=`<circle cx="${A[0]+(B[0]-A[0])*e}" cy="${A[1]+(B[1]-A[1])*e}" r="9" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`}
  o+=`<circle cx="24" cy="420" r="6" fill="var(--b)" stroke="var(--ink)" stroke-width="1.2"/><text x="36" y="424" font-size="12" font-weight="700">${m-1} and 1, beside the top</text>`;
  if(roots.length)o+=`<circle cx="238" cy="420" r="6" fill="var(--card)" stroke="${PINK}" stroke-width="3"/><text x="250" y="424" font-size="12" font-weight="700" style="fill:${PINK}">${roots.length} more that square to 1</text>`;
  $('fig').innerHTML=o;
  const end=hop===r.length-1,x=r[hop],pr=isPrime(m),f=factor(m).join(' × ');
  $('rule').innerHTML=(hop===0?`<span>Start at ${r[0]}.</span><span class="sm">${m-1} = ${d}${' × 2'.repeat(k)}, so begin at ${cb}${sup(d)} and square ${k} ${k===1?'time':'times'}.</span>`:`<span class="big">${r[hop-1]} × ${r[hop-1]} lands on ${x}</span>`)+
    (end?(v==='pass'?`<span style="color:var(--b)">${r.length===1?`It is on 1 from the start`:`It came to 1 through ${m-1}, the proper way in`}. ${m} passes.</span>${pr?'':`<span class="sm">${m} = ${f} is not prime, though. A rare liar: start from another number.</span>`}`
      :v==='wrong'?`<span style="color:${PINK}">It came to 1 from ${r[r.length-2]}, a pink point. A prime clock has none, so ${m} = ${f} is not prime.</span>`
      :`<span style="color:${PINK}">The squarings are used up and it is on ${x}, not 1. So ${m} = ${f} is not prime.</span>`):'');
  $('prev').disabled=hop===0;$('next').disabled=end;
  const w=$('seq');if(w)w.innerHTML=r.map((y,i)=>`<button type="button" data-h="${i}" class="${i===hop?'on':''}">${y}</button>`).join('<span aria-hidden="true">→</span>');
}
function hopTo(i){cancelAnimationFrame(anim);const r=route().r;i=Math.max(0,Math.min(r.length-1,i));
  if(i!==hop+1){hop=i;hp=0;draw();return}
  const t0=performance.now(),f=now=>{hp=Math.min(1,(now-t0)/800);if(hp>=1){hop=i;hp=0}draw();if(hp>0)anim=requestAnimationFrame(f)};hp=.001;anim=requestAnimationFrame(f)}

function notes(){
  const el=$('notes');
  if(tab===0){const pr=isPrime(n);
    el.innerHTML=`<h2>Sort the necklaces</h2>
<ol class="steps" id="steps">${['<b>Make every string.</b>','<b>One necklace</b> is several strings.','<b>Sort</b> the strings into piles.','<b>Count</b> the piles.'].map(t=>`<li role="button" tabindex="0"><span>${t}</span></li>`).join('')}</ol>
<h3>Fermat&rsquo;s little theorem</h3><p class="fm"><span>a<sup>p</sup> &minus; a</span><span class="op">is a multiple of</span><span>p</span></p>
<p class="fm sm"><span>${a}${sup(n)} &minus; ${a} = ${S.tot-a}</span><span class="op">${(S.tot-a)%n===0?'=':'is not a multiple of'}</span><span>${(S.tot-a)%n===0?`${n} &times; ${(S.tot-a)/n}`:n}</span></p>
<p class="hint">${pr?'Now try 4 or 6 beads, and tap a short pile to see why it is short.':'Tap a short pile: its necklace repeats a block. A prime number of beads leaves no room for that.'}</p>`}
  if(tab===1)el.innerHTML=`<h2>Who passes?</h2><p class="hint">Each square is a number from 1 to ${LIM}. It is coloured if a<sup>n</sup> &minus; a is a multiple of n, the way it must be when n is prime. Tap a square.</p>
<ol class="how"><li>With 2 colours only two numbers lie: 341 and 561.</li><li>561 lies for every number of colours.</li><li>Tick the extra check and the liars go. The clock tab shows what the check looks at.</li></ol>`;
  if(tab===2)el.innerHTML=`<h2>Round the clock</h2><p class="hint">Put the numbers 0 to n &minus; 1 round a clock. Squaring a number makes it hop.</p>
<div class="chips seq" id="seq" aria-label="The hops so far. Tap one to jump to it."></div>
<ol class="how"><li>On every clock, two points hop straight to 1: the two beside the top.</li><li>On a prime clock they are the only ones.</li><li>So a hop into 1 from anywhere else gives the number away.</li></ol>
<p class="hint">Try 341 and 561, the two liars from the board, then 97.</p>`;
  mark();
}
function mark(){const s=$('steps');if(s)[...s.children].forEach((li,i)=>{li.classList.toggle('on',i===st);li.setAttribute('aria-current',i===st?'step':'false')})}
function draw(){if(tab===0){draw0();$('prev').disabled=st===0;$('next').disabled=st===3;mark()}else if(tab===1)draw1();else draw2()}
function glide(v){cancelAnimationFrame(anim);const from=gl,t0=performance.now();if(from===v){draw();return}
  const f=now=>{const u=Math.min(1,(now-t0)/1000);gl=from+(v-from)*u;draw();if(u<1)anim=requestAnimationFrame(f)};anim=requestAnimationFrame(f)}
function jump(i){st=Math.max(0,Math.min(3,i));glide(st>=2?1:0)}
function lens(){const m=MAXN[a];if(n>m)n=m;$('len').innerHTML=Array.from({length:m-1},(_,i)=>`<option${i+2===n?' selected':''}>${i+2}</option>`).join('')}
function select(i){cancelAnimationFrame(anim);tab=i;[...$('tabs').children].forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  $('c-test').hidden=tab!==1;$('c-step').hidden=tab===1;$('c-size').hidden=tab!==0;$('c-clock').hidden=tab!==2;if(tab===0){st=0;gl=0;build()}if(tab===2){hop=0;hp=0;clocks()}notes();draw()}
function clocks(){const l=CLOCKS.includes(cn)?CLOCKS:CLOCKS.concat(cn).sort((x,y)=>x-y);$('cn').innerHTML=l.map(x=>`<option${x===cn?' selected':''}>${x}</option>`).join('');$('cb').value=cb}
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" type="button" aria-selected="${i===0}"><span class="n">${i+1}</span>${t}</button>`).join('');
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select([...$('tabs').children].indexOf(b))});
$('prev').addEventListener('click',()=>tab===2?hopTo(hop-1):jump(st-1));$('next').addEventListener('click',()=>tab===2?hopTo(hop+1):jump(st+1));
$('cn').addEventListener('change',e=>{cancelAnimationFrame(anim);cn=+e.target.value;hop=0;hp=0;draw()});
$('cb').addEventListener('change',e=>{cancelAnimationFrame(anim);cb=+e.target.value;hop=0;hp=0;draw()});
$('col').addEventListener('change',e=>{a=+e.target.value;lens();cancelAnimationFrame(anim);st=0;gl=0;sel=1;build();notes();draw()});
$('len').addEventListener('change',e=>{n=+e.target.value;cancelAnimationFrame(anim);st=0;gl=0;sel=1;build();notes();draw()});
$('base').addEventListener('change',e=>{base=+e.target.value;draw()});
$('strong').addEventListener('change',e=>{strong=e.target.checked;draw()});
$('fig').addEventListener('click',e=>{const s=e.target.closest('[data-i]'),c=e.target.closest('[data-q]');
  if(s&&tab===0){sel=+s.dataset.i;if(st===0)jump(1);else draw()}if(c&&tab===1){q=+c.dataset.q;draw()}});
$('rule').addEventListener('click',e=>{const c=e.target.closest('[data-q]'),k=e.target.closest('[data-clock]');if(k){cn=+k.dataset.clock;cb=base;select(2);return}if(c){q=+c.dataset.q;draw()}});
$('notes').addEventListener('click',e=>{const li=e.target.closest('#steps li'),h=e.target.closest('#seq button');
  if(li)jump([...li.parentNode.children].indexOf(li));if(h)hopTo(+h.dataset.h)});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),li=e.target.closest&&e.target.closest('#steps li');
  if(li&&(e.key===' '||e.key==='Enter')){e.preventDefault();jump([...li.parentNode.children].indexOf(li));return}
  if(tag==='input'||tag==='select'||tab===1)return;
  const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();if(tab===2)hopTo(hop+d);else jump(st+d)}});
lens();select(0);
</script>
</body>
</html>
